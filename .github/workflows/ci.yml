name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff, including Bandit's security rules)
        run: ruff check . && ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - name: Tests with coverage (fails under the minimum in pyproject.toml)
        run: coverage run -m pytest && coverage report
      - name: Coverage summary
        if: always()
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt pip-audit==2.10.1
      - name: Known vulnerabilities in installed packages
        run: pip-audit --progress-spinner off

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the API with PostgreSQL and Redis
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test (offline requests; no routing API call)
        run: |
          curl -fsS -o /dev/null http://localhost:8000/map
          curl -fsS "http://localhost:8000/api/places?q=chic" | grep -q '"Chicago, IL"'
          code=$(curl -s -o out.json -w '%{http_code}' "http://localhost:8000/api/route?start=Toronto,%20Ontario&finish=Chicago,%20IL")
          test "$code" = 400 && grep -q outside_usa out.json
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
